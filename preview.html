<!doctype html>
<html lang="en" data-theme="system" data-motion="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breathe — preview</title>
<meta name="description" content="Standalone preview of the Breathe guided breathing player.">
<style>/* ==================================================================
   Breathe — design system

   One accent. One radius family. One spacing scale. One type scale.
   Phase colours are low-chroma relatives of the accent rather than
   competing hues, so a session never looks like a dashboard.

   Contrast is checked for WCAG 2.2 AA (4.5:1 body, 3:1 large text and
   UI boundaries). The `contrast` theme targets AAA.
   ================================================================== */

:root {
  /* ---- type scale (fluid, 1.25 ratio, capped so it never shouts) ---- */
  --text-scale: 1;
  --step--2: 0.78rem;
  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: clamp(1.125rem, 1.06rem + 0.3vw, 1.25rem);
  --step-2: clamp(1.35rem, 1.2rem + 0.7vw, 1.6rem);
  --step-3: clamp(1.6rem, 1.35rem + 1.2vw, 2.15rem);
  --step-4: clamp(2.1rem, 1.6rem + 2.4vw, 3.25rem);
  --step-5: clamp(2.6rem, 1.8rem + 3.6vw, 4.25rem);

  /* ---- spacing scale ---- */
  --s-1: 0.25rem;
  --s-2: 0.5rem;
  --s-3: 0.75rem;
  --s-4: 1rem;
  --s-5: 1.5rem;
  --s-6: 2rem;
  --s-7: 3rem;
  --s-8: 4.5rem;
  --s-9: 7rem;

  /* ---- shape ---- */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 32px;
  --r-full: 999px;

  /* ---- measure ---- */
  --measure: 36rem;
  --maxw: 72rem;

  /* ---- motion ---- */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-breath: cubic-bezier(0.42, 0, 0.58, 1);
  --dur-fast: 140ms;
  --dur: 240ms;
  --dur-slow: 520ms;

  /* ---- type faces ---- */
  --font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
    sans-serif;
  --font-display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, ui-serif, Georgia,
    serif;

  /* ---- light: warm paper, not clinical grey ---- */
  --bg: #f6f5f1;
  --bg-elev: #fffefb;
  --bg-sunk: #edebe4;
  --bg-tint: #e8efec;
  --fg: #16211f;
  --fg-muted: #55625e;
  --fg-faint: #66706d;
  --line: #e2ded4;
  --line-strong: #8f8b82;

  --accent: #0e6a5a;
  --accent-hover: #0a5347;
  --accent-fg: #ffffff;
  --accent-soft: #dcebe6;

  --inhale: #0e6a5a;
  --hold: #5d6486;
  --exhale: #2c6f80;
  --rest: #6f7873;

  --danger: #8f2f2b;
  --focus: #0e6a5a;

  --shadow-1: 0 1px 2px rgb(22 33 31 / 5%), 0 2px 8px rgb(22 33 31 / 4%);
  --shadow-2: 0 2px 4px rgb(22 33 31 / 5%), 0 14px 40px -12px rgb(22 33 31 / 14%);
  --orb-glow: 0 0 80px -10px rgb(14 106 90 / 22%);

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root[data-theme='system'] {
    color-scheme: dark;
    --bg: #0a1110;
    --bg-elev: #101917;
    --bg-sunk: #060d0c;
    --bg-tint: #102420;
    --fg: #e7ede9;
    --fg-muted: #9dada8;
    --fg-faint: #7d8c88;
    --line: #22302d;
    --line-strong: #586562;
    --accent: #5ed3b8;
    --accent-hover: #7fe0c9;
    --accent-fg: #04231d;
    --accent-soft: #14302a;
    --inhale: #5ed3b8;
    --hold: #a9adda;
    --exhale: #77c4dd;
    --rest: #93a09c;
    --danger: #ff9f9b;
    --focus: #5ed3b8;
    --shadow-1: 0 1px 2px rgb(0 0 0 / 40%), 0 2px 10px rgb(0 0 0 / 25%);
    --shadow-2: 0 2px 6px rgb(0 0 0 / 45%), 0 18px 48px -14px rgb(0 0 0 / 60%);
    --orb-glow: 0 0 110px -12px rgb(94 211 184 / 26%);
  }
}

:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #0a1110;
  --bg-elev: #101917;
  --bg-sunk: #060d0c;
  --bg-tint: #102420;
  --fg: #e7ede9;
  --fg-muted: #9dada8;
  --fg-faint: #7d8c88;
  --line: #22302d;
  --line-strong: #586562;
  --accent: #5ed3b8;
  --accent-hover: #7fe0c9;
  --accent-fg: #04231d;
  --accent-soft: #14302a;
  --inhale: #5ed3b8;
  --hold: #a9adda;
  --exhale: #77c4dd;
  --rest: #93a09c;
  --danger: #ff9f9b;
  --focus: #5ed3b8;
  --shadow-1: 0 1px 2px rgb(0 0 0 / 40%), 0 2px 10px rgb(0 0 0 / 25%);
  --shadow-2: 0 2px 6px rgb(0 0 0 / 45%), 0 18px 48px -14px rgb(0 0 0 / 60%);
  --orb-glow: 0 0 110px -12px rgb(94 211 184 / 26%);
}

:root[data-theme='contrast'] {
  color-scheme: dark;
  --bg: #000000;
  --bg-elev: #000000;
  --bg-sunk: #000000;
  --bg-tint: #000000;
  --fg: #ffffff;
  --fg-muted: #ffffff;
  --fg-faint: #ffffff;
  --line: #ffffff;
  --line-strong: #ffffff;
  --accent: #ffe14d;
  --accent-hover: #fff28a;
  --accent-fg: #000000;
  --accent-soft: #1c1a00;
  --inhale: #ffe14d;
  --hold: #8fe9ff;
  --exhale: #a8ff9e;
  --rest: #ffffff;
  --danger: #ff9a9a;
  --focus: #ffe14d;
  --shadow-1: none;
  --shadow-2: none;
  --orb-glow: none;
}

:root[data-theme='contrast'] .card,
:root[data-theme='contrast'] .btn,
:root[data-theme='contrast'] .chip {
  border-width: 2px;
}

/* ------------------------------------------------------------------ */
/* base                                                                */
/* ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: calc(100% * var(--text-scale));
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--step-0);
  line-height: 1.6;
  letter-spacing: -0.003em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 1.12;
  letter-spacing: -0.018em;
  margin: 0 0 0.5em;
  text-wrap: balance;
  color: var(--fg);
}

h1 {
  font-size: var(--step-4);
}
h2 {
  font-size: var(--step-3);
  line-height: 1.18;
}
h3 {
  font-size: var(--step-1);
  line-height: 1.3;
  letter-spacing: -0.01em;
}
h4 {
  font-size: var(--step-0);
  font-family: var(--font);
  font-weight: 600;
  letter-spacing: 0;
}

p {
  margin: 0 0 1em;
  text-wrap: pretty;
}

a {
  color: var(--accent);
  text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
  text-underline-offset: 0.22em;
  text-decoration-thickness: 1px;
  transition: color var(--dur-fast) var(--ease-soft),
    text-decoration-color var(--dur-fast) var(--ease-soft);
}
a:hover {
  color: var(--accent-hover);
  text-decoration-color: currentColor;
}

strong {
  font-weight: 600;
}

kbd {
  font: inherit;
  font-size: 0.85em;
  padding: 0.1em 0.42em;
  border: 1px solid var(--line-strong);
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--bg-elev);
  white-space: nowrap;
}

/* One focus treatment everywhere, keyboard-only. */
:focus {
  outline: none;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
  border-radius: 6px;
}

img,
svg {
  max-width: 100%;
}

hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: var(--s-7) 0;
}

::selection {
  background: var(--accent-soft);
  color: var(--fg);
}

/* ------------------------------------------------------------------ */
/* layout                                                              */
/* ------------------------------------------------------------------ */

.wrap {
  width: 100%;
  max-width: var(--maxw);
  margin-inline: auto;
  padding-inline: clamp(1.15rem, 4vw, 2.5rem);
}

.narrow {
  max-width: 46rem;
}

/* Vertical rhythm for page sections — replaces ad-hoc inline padding. */
.section {
  padding-block: var(--s-7);
}
@media (min-width: 900px) {
  .section {
    padding-block: var(--s-8);
  }
}
.section-tight {
  padding-block: var(--s-6);
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-3);
  align-items: center;
}

.grid {
  display: grid;
  gap: var(--s-4);
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 17.5rem), 1fr));
}

.muted {
  color: var(--fg-muted);
}
.small {
  font-size: var(--step--1);
}
.center {
  text-align: center;
}

/* A short label above a heading — gives sections a hierarchy without
   resorting to another font size. */
.eyebrow {
  display: block;
  font-size: var(--step--2);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-faint);
  margin-bottom: var(--s-3);
}

.section-head {
  max-width: 42rem;
  margin-bottom: var(--s-6);
}
.section-head p {
  color: var(--fg-muted);
  font-size: var(--step-1);
  margin-bottom: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent);
  color: var(--accent-fg);
  padding: var(--s-3) var(--s-5);
  z-index: 100;
  border-radius: 0 0 var(--r-md) 0;
  font-weight: 600;
}
.skip-link:focus {
  left: 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ------------------------------------------------------------------ */
/* scroll reveal                                                       */
/* ------------------------------------------------------------------ */

.reveal {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity var(--dur-slow) var(--ease-out),
    transform var(--dur-slow) var(--ease-out);
}
.reveal[data-shown='true'] {
  opacity: 1;
  transform: none;
}

/* ------------------------------------------------------------------ */
/* buttons                                                             */
/* ------------------------------------------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  min-height: 46px;
  padding: 0.65rem 1.2rem;
  border-radius: var(--r-full);
  border: 1px solid var(--line-strong);
  background: var(--bg-elev);
  color: var(--fg);
  font: inherit;
  font-size: var(--step--1);
  font-weight: 600;
  letter-spacing: 0.005em;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-soft),
    border-color var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft),
    transform var(--dur-fast) var(--ease-soft), box-shadow var(--dur) var(--ease-soft);
}
.btn:hover {
  border-color: var(--line-strong);
  background: var(--bg-sunk);
  color: var(--fg);
}
.btn:active {
  transform: scale(0.975);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
  box-shadow: var(--shadow-1);
}
.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  color: var(--accent-fg);
  box-shadow: var(--shadow-2);
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--fg-muted);
}
.btn-ghost:hover {
  background: var(--bg-sunk);
  color: var(--fg);
}

.btn-lg {
  font-size: var(--step-0);
  padding: 0.9rem 1.8rem;
  min-height: 54px;
}

.btn[aria-pressed='true'] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--fg);
}

/* Filter chips — lighter than buttons, used for the technique filter. */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  min-height: 42px;
  padding: 0.45rem 1rem;
  border-radius: var(--r-full);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg-muted);
  font: inherit;
  font-size: var(--step--1);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-soft);
}
.chip:hover {
  border-color: var(--line-strong);
  color: var(--fg);
}
.chip[aria-pressed='true'] {
  background: var(--fg);
  border-color: var(--fg);
  color: var(--bg);
}

/* ------------------------------------------------------------------ */
/* cards                                                               */
/* ------------------------------------------------------------------ */

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s-5);
  box-shadow: var(--shadow-1);
}

a.card {
  display: flex;
  flex-direction: column;
  color: inherit;
  text-decoration: none;
  transition: transform var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out),
    border-color var(--dur) var(--ease-out);
}
a.card:hover {
  border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
  transform: translateY(-3px);
  box-shadow: var(--shadow-2);
}
a.card:active {
  transform: translateY(-1px);
}
a.card h3 {
  margin-bottom: var(--s-2);
}

/* The arrow that slides on hover — the only decorative motion on a card. */
.card-go {
  margin-top: auto;
  padding-top: var(--s-4);
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--accent);
}
.card-go svg {
  transition: transform var(--dur) var(--ease-out);
}
a.card:hover .card-go svg {
  transform: translateX(4px);
}

.tag {
  display: inline-flex;
  align-items: center;
  font-size: var(--step--2);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.25rem 0.6rem;
  border-radius: var(--r-full);
  background: var(--bg-sunk);
  color: var(--fg-muted);
}

.note {
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  background: var(--bg-elev);
  padding: var(--s-5);
  border-radius: 0 var(--r-md) var(--r-md) 0;
}
.note-warn {
  border-left-color: var(--danger);
}
.note h3 {
  margin-top: 0;
}
.note > :last-child {
  margin-bottom: 0;
}

/* ------------------------------------------------------------------ */
/* header / footer                                                     */
/* ------------------------------------------------------------------ */

.site-header {
  position: sticky;
  top: 0;
  z-index: 30;
  border-bottom: 1px solid transparent;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  transition: border-color var(--dur) var(--ease-soft);
}
.site-header[data-stuck='true'] {
  border-bottom-color: var(--line);
}
.site-header .wrap {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  min-height: 68px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--font-display);
  font-size: var(--step-1);
  color: var(--fg);
  text-decoration: none;
  letter-spacing: -0.01em;
}
.brand svg {
  color: var(--accent);
  flex: none;
}

.site-nav {
  margin-left: auto;
  display: flex;
  gap: var(--s-1);
  align-items: center;
}
.site-nav a {
  color: var(--fg-muted);
  text-decoration: none;
  padding: 0.5rem 0.8rem;
  border-radius: var(--r-full);
  font-size: var(--step--1);
  font-weight: 500;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  transition: color var(--dur-fast) var(--ease-soft),
    background var(--dur-fast) var(--ease-soft);
}
.site-nav a:hover {
  color: var(--fg);
  background: var(--bg-sunk);
}

/* Below 620px the wordy links collapse; Techniques + Settings stay, the rest
   live in the footer. A hamburger for four links would be worse.
   Note the `.site-nav a` prefix — it has to out-specify the rule above, which
   is what made an earlier version of this quietly never collapse. */
@media (max-width: 620px) {
  .site-nav a.nav-secondary {
    display: none;
  }
  .site-header .wrap {
    min-height: 58px;
    gap: var(--s-2);
  }
  .site-nav a {
    padding-inline: var(--s-3);
  }
}

/* Below 480px the Settings button loses its text label and becomes the gear
   alone. It keeps an aria-label, so it is still announced as "Settings" — this
   buys about 70px, which is what lets both Techniques and Guides stay visible
   on a 375px phone instead of one of them being hidden away. */
@media (max-width: 480px) {
  .btn-icon .btn-label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }
  .btn-icon {
    padding-inline: 0.7rem;
  }
  .site-nav a {
    padding-inline: var(--s-2);
    font-size: var(--step--2);
  }
}

/* 360px and below: keep the mark, drop the wordmark. Every pixel of the row
   is then doing something — nothing gets pushed off the edge. */
@media (max-width: 360px) {
  .brand {
    font-size: 0;
    gap: 0;
  }
  .brand svg {
    width: 26px;
    height: 26px;
  }
  .site-nav {
    gap: 0;
  }
  .site-nav a {
    padding-inline: var(--s-2);
  }
  .site-header .btn {
    padding-inline: var(--s-3);
  }
}

.site-footer {
  border-top: 1px solid var(--line);
  margin-top: var(--s-9);
  padding: var(--s-8) 0 var(--s-7);
  color: var(--fg-muted);
  font-size: var(--step--1);
  background: var(--bg-sunk);
}
.site-footer a {
  color: var(--fg-muted);
  text-decoration: none;
}
.site-footer a:hover {
  color: var(--fg);
  text-decoration: underline;
}
.site-footer strong {
  color: var(--fg);
  display: block;
  margin-bottom: var(--s-3);
  font-size: var(--step--1);
}
.footer-cols {
  display: grid;
  gap: var(--s-6) var(--s-5);
  grid-template-columns: 1fr 1fr;
}
.footer-cols > :first-child {
  grid-column: 1 / -1;
}
@media (min-width: 760px) {
  .footer-cols {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .footer-cols > :first-child {
    grid-column: 1 / -1;
  }
}
@media (min-width: 1100px) {
  .footer-cols {
    grid-template-columns: 1.5fr repeat(5, minmax(0, 1fr));
  }
  .footer-cols > :first-child {
    grid-column: auto;
  }
}
.footer-cols ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.footer-cols li {
  margin-bottom: var(--s-2);
}
.footer-legal {
  margin-top: var(--s-7);
  padding-top: var(--s-5);
  border-top: 1px solid var(--line);
  font-size: var(--step--2);
  color: var(--fg-faint);
  max-width: 46rem;
}

/* ------------------------------------------------------------------ */
/* hero + the orb                                                      */
/* ------------------------------------------------------------------ */

.hero {
  position: relative;
  display: grid;
  gap: var(--s-5);
  align-items: center;
  justify-items: center;
  text-align: center;
  padding-block: clamp(1.5rem, 5vw, 3rem) var(--s-7);
  grid-template-columns: 1fr;
  /* On a phone the orb sits between the headline and the buttons, so the
     product itself is on the first screen rather than three scrolls down. */
  grid-template-areas:
    'title'
    'orb'
    'copy';
}
.hero-title {
  grid-area: title;
}
.hero-copy {
  grid-area: copy;
}
.hero .orb-stage {
  grid-area: orb;
}

@media (min-width: 900px) {
  .hero {
    grid-template-columns: 1.05fr 0.95fr;
    grid-template-areas:
      'title orb'
      'copy orb';
    align-items: start;
    justify-items: start;
    text-align: left;
    gap: var(--s-4) var(--s-8);
    padding-block: var(--s-7) var(--s-8);
  }
  .hero .orb-stage {
    align-self: center;
  }
}

.hero h1 {
  font-size: var(--step-5);

.orb-stage {
  position: relative;
  width: min(64vw, 17rem);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  justify-self: center;
}

.orb-rings {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  opacity: 0.9;
}
.orb-rings::before,
.orb-rings::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--line);
}
.orb-rings::before {
  inset: 12%;
}
.orb-rings::after {
  inset: 24%;
  border-style: dashed;
  opacity: 0.7;
}

.orb {
  position: relative;
  width: 62%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 38%,
    color-mix(in srgb, var(--accent) 42%, var(--bg-elev)),
    color-mix(in srgb, var(--accent) 78%, transparent) 72%
  );
  box-shadow: var(--orb-glow);
  will-change: transform;
  animation: orb-breathe 11s var(--ease-breath) infinite;
}

@media (min-width: 900px) {
  .orb-stage {
    width: min(40vw, 26rem);
  }
}

@keyframes orb-breathe {
  0% {
    transform: scale(0.62);
  }
  50% {
    transform: scale(1.32);
  }
  100% {
    transform: scale(0.62);
  }
}

.orb-caption {
  position: absolute;
  bottom: -0.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-display);
  font-size: var(--step-1);
  color: var(--fg-muted);
  white-space: nowrap;
}
.orb-caption span {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  animation: caption-swap 11s var(--ease-soft) infinite;
}
/* Negative delay starts the second label half a cycle in, so the two cross-fade
   instead of stacking. Base opacity is 0 — otherwise both are painted until the
   animation first runs, which is exactly what it looked like. */
.orb-caption span:nth-child(2) {
  animation-delay: -5.5s;
}
/* Each label owns half the cycle with a short cross-fade at the handover.
   An earlier version left a two-second gap where neither was visible — which
   read as the caption blinking off rather than swapping. */
@keyframes caption-swap {
  0%,
  44% {
    opacity: 1;
  }
  50%,
  94% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}

/* ------------------------------------------------------------------ */
/* the session player                                                  */
/* ------------------------------------------------------------------ */

.player {
  min-height: 100svh;

.player-bar {

.player-main {

  text-align: center;
}

/* Audio-only mode: the whole screen recedes but never fully disappears,
   and comes back the moment anything is focused or hovered. */
.player[data-dim='true'] .player-main {
  opacity: 0.32;
  transition: opacity 1.2s var(--ease-soft);
}
.player[data-dim='true'] .player-main:hover,
.player[data-dim='true'] .player-main:focus-within {
  opacity: 1;
  transition: opacity var(--dur) var(--ease-soft);
}

.pacer-wrap {
  position: relative;
  width: min(70vw, 20rem);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  margin-bottom: var(--s-2);
}

/* The still outer ring gives the moving circle something to move against,
   so "how far through the breath am I" is readable at a glance. */
.pacer-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  opacity: 0.55;
}
.pacer-ring::after {
  content: '';
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  border: 1px dashed var(--line);
  opacity: 0.55;
}

.pacer {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 38%,
    color-mix(in srgb, var(--phase-color) 38%, var(--bg-elev)),
    color-mix(in srgb, var(--phase-color) 72%, transparent) 74%
  );
  box-shadow: 0 0 70px -18px color-mix(in srgb, var(--phase-color) 38%, transparent);
  transform: scale(var(--pacer-scale, 0.3));
  will-change: transform;
  /* Duration and easing are set per phase from JS — see BreathPlayer. */
  transition-property: transform;
  transition-timing-function: var(--ease-breath);
  transition-duration: 0ms;
}

.pacer-label {
  position: absolute;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.pacer-count {
  font-family: var(--font-display);

  line-height: 1;
  color: var(--fg);
  opacity: 0.85;
}

/* The phase word is the focal point — bigger than the count, and it is
   what someone glancing at the screen needs to read. */
.phase-label {
  font-family: var(--font-display);
  font-size: var(--step-3);
  line-height: 1.1;
  min-height: 1.25em;

.phase-instruction {

.player-meta {

.player-progress {

}

.player-controls {

  margin-top: var(--s-2);

/* Reduced motion: the circle holds still at a readable size and the bar
   under it carries the timing instead. */
:root[data-motion='reduced'] .pacer {
  transform: scale(0.82) !important;
  transition: none !important;
  opacity: 0.35;

}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .reveal {

  }
  a.card:hover {

}

      return '<div class="field"><span id="' + key + '-l">' + label + '</span><div class="choices" role="group" aria-labelledby="' + key + '-l">' +
        opts.map(function (o) {
          return '<button type="button" class="btn" data-choice="' + key + '" data-value="' + o[0] + '" aria-pressed="' + (String(p[key]) === String(o[0])) + '">' + o[1] + '</button>';
        }).join('') + '</div></div>';
    }
    return '<div class="wrap narrow" style="padding-block:var(--s-5)"><div class="settings">' +
      '<fieldset class="fieldset"><legend>Sound</legend>' +
      sw('voice', 'Voice guidance') + sw('countAloud', 'Count the seconds out loud') +
      sw('countTicks', 'Count with a beat') +
      sw('tones', 'Tones') + sw('ambient', 'Background hum') + sw('endChime', 'Chime at the end') +
      '<div class="field"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.05" value="' + p.volume + '" data-range="volume"></div>' +
      '<div class="field"><label for="rate">Speaking speed</label><input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="' + p.rate + '" data-range="rate"></div>' +
      '<button type="button" class="btn" id="testsound">Test the sound</button>' +
      '</fieldset>' +
      '<fieldset class="fieldset"><legend>Display</legend>' +
      choices('theme', 'Theme', [['system', 'System'], ['light', 'Light'], ['dark', 'Dark'], ['contrast', 'High contrast']]) +
      choices('textScale', 'Text size', [[100, '100%'], [112, '112%'], [125, '125%'], [150, '150%'], [175, '175%']]) +
      choices('motion', 'Movement', [['auto', 'Animated circle'], ['reduced', 'Still, with a bar']]) +
      choices('countStyle', 'Counting', [['up', 'Count up'], ['down', 'Count down']]) +
      sw('audioOnly', 'Audio-only mode') + sw('showCountdown', 'Show the number') +
      '</fieldset>' +
      '<fieldset class="fieldset"><legend>Access</legend>' +
      sw('haptics', 'Vibrate on each change') +
      '<div class="field"><label for="pace">Pace</label><input id="pace" type="range" min="0.7" max="1.4" step="0.05" value="' + p.paceScale + '" data-range="paceScale"></div>' +
      '</fieldset></div></div>';
  }

  function render() {
    rebuild();
    var t = technique();
    var html = '<div class="player" data-dim="' + (state.prefs.audioOnly && state.status === 'running') + '" style="--phase-color:var(--inhale)">';

    html += '<div class="player-bar wrap">' +
      '<label class="sr-only" for="pick">Technique</label>' +
      '<select id="pick" style="max-width:15rem">' +
      TECHNIQUES.map(function (x) {
        return '<option value="' + x.slug + '"' + (x.slug === state.slug ? ' selected' : '') + '>' + x.name + '</option>';
      }).join('') + '</select>' +
      '<button type="button" class="btn btn-ghost" id="settings-toggle" style="margin-left:auto" aria-expanded="' + state.settingsOpen + '">' +
      (state.settingsOpen ? 'Done' : 'Settings') + '</button></div>';

    if (state.settingsOpen) html += settingsHtml();
    html += '<div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>';
    html += '<main class="player-main" id="main">';

    if (state.status === 'ready') {
      html += '<span class="eyebrow">' + t.bpm + '</span>';
      html += '<h1 style="margin-bottom:0">' + t.name + '</h1><p class="phase-instruction">' + t.intro + '</p>';
      html += '<div class="field" style="max-width:30rem;width:100%"><div class="choices" role="group" aria-label="Session length" style="justify-content:center">' +
        t.minuteOptions.map(function (m) {
          return '<button type="button" class="btn" data-minutes="' + m + '" aria-pressed="' + (state.minutes === m) + '">' + m + ' min</button>';
        }).join('') + '</div></div>';
      html += '<button type="button" class="btn btn-primary btn-lg" id="begin">Begin</button>';
      html += '<p class="player-meta">' + timeline.cycles + ' breaths · <kbd>Space</kbd> to start or pause · <kbd>Esc</kbd> to stop</p>';
    } else if (state.status === 'lead') {
      html += '<h1 style="margin-bottom:0">' + t.name + '</h1><p class="lede" style="max-width:34rem">' + t.intro + '</p>';
      html += '<p class="player-meta">Get comfortable. The first breath starts in a moment.</p>';
      html += '<div class="player-controls"><button type="button" class="btn btn-primary btn-lg" id="startnow">Start now</button>' +
        '<button type="button" class="btn btn-lg" id="stop">Cancel</button></div>';
    } else if (state.status === 'done') {
      html += '<h1 style="margin-bottom:0">Done.</h1><p class="lede" style="max-width:32rem">' + t.outro + '</p>';
      html += '<p class="player-meta">' + timeline.cycles + ' breaths over ' + formatClock(timeline.duration) + '</p>';
      html += '<div class="player-controls"><button type="button" class="btn btn-primary btn-lg" id="begin">Go again</button></div>';
      html += '<aside class="ad-slot"><span class="ad-label">Advertisement</span><div class="ad-frame">Only ever here, after the session.</div></aside>';
    } else {
      html += '<div class="pacer-wrap"><div class="pacer-ring" aria-hidden="true"></div>' +
        '<div class="pacer" aria-hidden="true"></div>' +
        (state.prefs.showCountdown ? '<div class="pacer-label" aria-hidden="true"><span class="pacer-count" data-pacer-count>&nbsp;</span></div>' : '') +
        '<div class="pacer-bar" aria-hidden="true"><div data-pacer-bar></div></div></div>';
      html += '<p class="phase-label" id="phase-label"></p>';
      html += '<div class="player-progress" role="progressbar" aria-label="Session progress"><div id="progress-fill" style="transform:scaleX(0)"></div></div>';
      html += '<p class="player-meta" id="time-left"></p>';
      html += '<div class="player-controls">' +
        (state.status === 'running'
          ? '<button type="button" class="btn btn-lg" id="pause">Pause</button>'
          : '<button type="button" class="btn btn-primary btn-lg" id="resume">Resume</button>') +
        '<button type="button" class="btn btn-lg" id="stop">End</button></div>';
    }

    html += '</main></div>';
    root.innerHTML = html;
    applyPrefs();
    wire();
  }

  function wire() {
    var pick = document.getElementById('pick');
    if (pick) pick.onchange = function () { state.slug = pick.value; state.minutes = technique().defaultMinutes; stop(); };
    var st = document.getElementById('settings-toggle');
    if (st) st.onclick = function () { state.settingsOpen = !state.settingsOpen; render(); };
    var begin = document.getElementById('begin');
    if (begin) begin.onclick = start;
    var sn = document.getElementById('startnow');
    if (sn) sn.onclick = beginNow;
    var p = document.getElementById('pause');
    if (p) p.onclick = pause;
    var r = document.getElementById('resume');
    if (r) r.onclick = resume;
    var s = document.getElementById('stop');
    if (s) s.onclick = stop;
    var ts = document.getElementById('testsound');
    if (ts) ts.onclick = function () { audio.resume().then(function () { audio.testCue(); }); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-minutes]'), function (b) {
      b.onclick = function () { state.minutes = Number(b.dataset.minutes); render(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pref]'), function (b) {
      b.onchange = function () { state.prefs[b.dataset.pref] = b.checked; applyPrefs(); render(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-choice]'), function (b) {
      b.onclick = function () {
        var v = b.dataset.value;
        state.prefs[b.dataset.choice] = isNaN(Number(v)) ? v : Number(v);
        applyPrefs();
        render();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-range]'), function (b) {
      b.oninput = function () { state.prefs[b.dataset.range] = Number(b.value); applyPrefs(); };
    });
  }

  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if ((tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') && e.key !== 'Escape') return;
    if (e.key === ' ' || e.key === 'k') {
      e.preventDefault();
      if (state.status === 'running') pause();
      else if (state.status === 'paused') resume();
      else if (state.status === 'lead') beginNow();
      else start();
    } else if (e.key === 'Escape') {
      stop();
    } else if (e.key === 's') {
      state.settingsOpen = !state.settingsOpen;
      render();
    }
  });

  window.__breathe = {
    state: state,
    start: start,
    beginNow: beginNow,
    stop: stop,
    seek: function (secs) { offset = secs; startedAt = performance.now(); },
    position: function () { return positionAt(timeline, state.elapsed); },
    setTechnique: function (slug) { state.slug = slug; render(); },
  };

  render();
})();

</script>
</body>
</html>
